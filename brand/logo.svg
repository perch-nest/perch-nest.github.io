<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Perch Nest">
  <defs>
    <!-- Perch's teal fading into Roost's ember -->
    <linearGradient id="nest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="0.42" stop-color="#2f5fb3"/>
      <stop offset="0.72" stop-color="#b9437a"/>
      <stop offset="1" stop-color="#ff6a2e"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#nest)"/>
  <!-- Perch's screen -->
  <rect x="11" y="27" width="42" height="25" rx="4.5" fill="none" stroke="#fff" stroke-width="4"/>
  <path d="M25 52h14" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <!-- two birds perched on it, facing each other: Perch on the left, Roost on the right -->
  <g fill="#fff">
    <path d="M14.5 21.5 9 19.2l2.4 5z"/>
    <ellipse cx="20.5" cy="21.6" rx="7" ry="5.2"/>
    <circle cx="25.4" cy="16.8" r="4.2"/>
    <path d="m29 15.6 2.9 1.3-2.9 1.3z"/>
    <path d="M49.5 21.5 55 19.2l-2.4 5z"/>
    <ellipse cx="43.5" cy="21.6" rx="7" ry="5.2"/>
    <circle cx="38.6" cy="16.8" r="4.2"/>
    <path d="m35 15.6-2.9 1.3 2.9 1.3z"/>
  </g>
  <circle cx="26.4" cy="16.1" r="1.1" fill="#0d9488"/>
  <circle cx="37.6" cy="16.1" r="1.1" fill="#e0532a"/>
</svg>
